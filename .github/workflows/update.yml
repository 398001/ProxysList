name: Auto Update Proxies

on:
  schedule:
    # Läuft automatisch alle 30 Minuten
    - cron: '*/30 * * * *'
  workflow_dispatch: # Erlaubt manuelles Starten per Klick

jobs:
  update-proxies:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp aiohttp-socks

      - name: Proxy Checker ausführen
        run: python Proxy-Checker.py

      - name: Frische Proxys in GitHub committen
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *_working.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Update: Frische Proxys generiert [skip ci]" && git push)
